[project]
name = "walkthrough-python-backend"
version = "0.2.0"
description = "Sandbox SDK Walkthrough — Python (FastAPI) backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "openai>=1.55.0",
    "anthropic>=0.40.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "sse-starlette>=2.1.0",
    # The TestOps SDK is installed from the local tarball at build time.
    # See Dockerfile: pip install /app/sdk-vendor/browserstack_ai_sdk-1.0.0a31.tar.gz
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.380",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
